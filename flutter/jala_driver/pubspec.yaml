name: jala_driver
description: Jala Ride — Driver app (Flutter)
publish_to: 'none'
version: 1.4.0+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.4
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2
  record: ^5.2.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app-icon.png
  adaptive_icon_background: "#0B0F14"
  adaptive_icon_foreground: assets/branding/app-icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/sounds/
