databases:
  - name: jala-ride-db
    plan: free
    databaseName: jalaride
    user: jalaride

services:
  - type: web
    name: jala-ride-api
    runtime: node
    plan: free
    rootDir: backend
    # Install with all deps (prisma/typescript are production deps). Prefer install over ci
    # so a lock drift never hard-blocks free-tier deploys.
    buildCommand: npm install && npx prisma generate && npm run build
    # --accept-data-loss is required when adding unique constraints (shareToken);
    # field is new/nullable so this is safe for our deploy.
    startCommand: npx prisma db push --accept-data-loss && (npx prisma db seed || true) && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: jala-ride-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      # Same Maps key used by mobile; restrict by IP/API in Google Cloud when possible
      - key: GOOGLE_MAPS_SERVER_KEY
        value: AIzaSyCi76exhyPWbzpZSXzP-4RpmBvvfE-V26I
      - key: GOOGLE_MAPS_API_KEY
        value: AIzaSyCi76exhyPWbzpZSXzP-4RpmBvvfE-V26I
